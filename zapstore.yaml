name: CallTags
summary: A phone app that lets you label calls and search them later.
description: |
  CallTags is a simple phone app with one extra trick: you can label your calls with anything you like, and find them again later.

  Got a call about the car insurance? Tag it "insurance". A week later, search "insurance" and the number is right there. Search the number instead, and you see every call with it along with what each one was about.

  - Dialpad and call history, nothing else, but replaces your contact list
  - Add any number of free-text labels to each call
  - Search history by number or by label
  - See what earlier calls with a number were about while it's ringing
  - Everything stays on your phone: no account, no internet, no ads

  CallTags works as your default phone app, so it handles incoming and outgoing calls itself.
