repository: https://github.com/andunieee/calltags
release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
match: '^calltags-.*\.apk$'
name: CallTags
summary: A minimal phone app that lets you label calls and search them later.
description: |
  A minimal Android phone app that lets you label calls with free text and search them later, replacing the traditional contact list.

  - Dialpad and call history are all you need
  - Tap any call to label the number or the call itself (like "insurance" or "bob's second phone")
  - Search history by number or by label
  - See a number's labels and notes from past calls while the phone is ringing
  - Attach rules to labels: block calls, only ring for certain labels or hours, hide numbers from history, or set colors
tags:
  - phone
  - dialer
  - productivity
  - privacy
license: GPL-3.0-only
website: https://github.com/andunieee/calltags
icon: ./graphics/icon.png
