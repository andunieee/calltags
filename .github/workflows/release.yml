name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch must be below 100"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ steps.version.outputs.code }}
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/calltags-${{ steps.version.outputs.name }}.apk"

      - name: Verify APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/*.apk

      - name: Keep R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk

      - uses: actions/setup-go@v5
        with:
          go-version-file: packaging/zapstore/go.mod
          cache-dependency-path: packaging/zapstore/go.sum

      # Publishes the APK from the release just created. Needs ZAPSTORE_OWNER_NSEC:
      # the nsec (or bunker:// URL) of the Nostr key that owns the listing.
      # packaging/zapstore makes the NIP-C1 certificate proof from the release
      # keystore, so the SIGNING_* secrets are needed too.
      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_OWNER_NSEC }}
          GITHUB_TOKEN: ${{ github.token }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGN_WITH" ]; then
            echo "::warning::ZAPSTORE_OWNER_NSEC is not set, skipping the Zapstore publish"
            exit 0
          fi
          # packaging/zapstore reads PKCS#12; convert the release JKS keystore.
          keytool -importkeystore -noprompt \
            -srckeystore "$SIGNING_STORE_FILE" -srcstorepass "$SIGNING_STORE_PASSWORD" \
            -srcalias "$SIGNING_KEY_ALIAS" -srckeypass "$SIGNING_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/release.p12" -deststoretype PKCS12 \
            -deststorepass "$SIGNING_STORE_PASSWORD" -destkeypass "$SIGNING_STORE_PASSWORD"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
          export ANDROID_KEYSTORE_PASSWORD="$SIGNING_STORE_PASSWORD"
          (cd packaging/zapstore && go build -o "$RUNNER_TEMP/zapstore" .)
          "$RUNNER_TEMP/zapstore"
