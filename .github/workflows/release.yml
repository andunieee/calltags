name: Release

# Push a tag like v1.2.3 to build a signed APK, publish it as a GitHub release (which is what
# Obtainium follows) and, if ZAPSTORE_SIGN_WITH is set, publish it to Zapstore.
# See PUBLISHING.md for the secrets this needs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZSP_VERSION: 0.4.17

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (always increasing, no manual bumps)
      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch must be below 100"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ steps.version.outputs.code }}
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/calltags-${{ steps.version.outputs.name }}.apk"

      - name: Verify APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/*.apk

      # needed to de-obfuscate stack traces from release builds
      - name: Keep R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "CallTags ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "::notice::ZAPSTORE_SIGN_WITH is not set, skipping Zapstore"
            exit 0
          fi
          if grep -q 'REPLACE_WITH_YOUR_NPUB' zapstore.yaml; then
            echo "::error::Set your npub as 'pubkey' in zapstore.yaml first"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/zsp" \
            "https://github.com/zapstore/zsp/releases/download/v$ZSP_VERSION/zsp-$ZSP_VERSION-linux-amd64"
          chmod +x "$RUNNER_TEMP/zsp"
          # fetches the APK from the GitHub release created above
          "$RUNNER_TEMP/zsp" publish --quiet zapstore.yaml
